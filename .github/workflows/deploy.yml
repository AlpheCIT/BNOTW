# Publish to GitHub Pages.
#
# Only useful if the repository is public, or on a plan that includes Pages for
# private repositories. On a free private repo this workflow will run and the
# deploy step will fail — use Netlify, Cloudflare Pages or Vercel instead, all
# of which serve a private repo for free. See the README.
#
# Enable under Settings -> Pages -> Source: GitHub Actions.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already in flight should finish; queued ones collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build typechecks; a broken deploy is worse than a late one.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
