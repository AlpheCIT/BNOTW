<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#166745"/>
      <stop offset="60%" stop-color="#0f4a32"/>
      <stop offset="100%" stop-color="#062318"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d489"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#9d7226"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- The rail: dark timber trimmed in brass, as the table is. -->
  <circle cx="256" cy="256" r="194" fill="none" stroke="#332317" stroke-width="30"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="url(#brass)" stroke-width="10"/>

  <!-- One letter, big enough to survive a home screen. -->
  <text x="256" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="268"
        font-weight="700" fill="url(#brass)" text-anchor="middle"
        dominant-baseline="central">B</text>

  <!-- The suits, small, as a rule beneath it. -->
  <g transform="translate(256 392)" text-anchor="middle">
    <text x="-54" y="0" font-size="62" fill="#f3efe6" font-family="Georgia, serif">♠</text>
    <text x="0" y="0" font-size="62" fill="#e8736f" font-family="Georgia, serif">♥</text>
    <text x="54" y="0" font-size="62" fill="#f3efe6" font-family="Georgia, serif">♣</text>
  </g>
</svg>
